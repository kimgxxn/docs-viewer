<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  office 문서 변환용 폰트 대체 규칙 (docs_viewer.py 가 FONTCONFIG_FILE 로 넘긴다)

  문서가 '맑은 고딕' 같은 윈도우 전용 한글 폰트를 지정하면 macOS 에는 그 폰트가 없다.
  이때 LibreOffice 는 자기가 번들한 폰트 중에서 고르는데, 번들 폰트에 한글이 하나도
  없어서(Alef/Amiri/DavidCLM 등 히브리·아랍 폰트뿐) 엉뚱하게 FrankRuhlHofshi 같은
  히브리어 폰트로 대체한다. 한글 글리프가 없으니 글자가 통째로 사라진다.
  그래서 시스템에 실제로 있는 CJK 폰트를 명시적으로 찍어준다.

  이 파일을 지우면 그냥 LibreOffice 기본 동작으로 돌아간다 (한글이 깨질 뿐 동작은 한다).
-->
<fontconfig>
  <!-- 없는 경로는 fontconfig 가 알아서 무시하므로 macOS/리눅스 경로를 같이 적어둔다 -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts/truetype</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- ── 한글: 고딕 계열 ───────────────────────────────────────────── -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>맑은 고딕</string>
    </test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Gulim</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>돋움</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Dotum</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>함초롬돋움</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple SD Gothic Neo</string></edit>
  </match>

  <!-- ── 한글: 명조(바탕) 계열 ─────────────────────────────────────── -->
  <match target="pattern">
    <test name="family"><string>바탕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AppleMyungjo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Batang</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AppleMyungjo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>궁서</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AppleMyungjo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>함초롬바탕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>AppleMyungjo</string></edit>
  </match>

  <!-- ── 일본어 ────────────────────────────────────────────────────── -->
  <match target="pattern">
    <test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hiragino Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS PGothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hiragino Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hiragino Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hiragino Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hiragino Mincho ProN</string></edit>
  </match>

  <!-- ── 중국어 ────────────────────────────────────────────────────── -->
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>新細明體</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>PingFang TC</string></edit>
  </match>

  <!-- ── 안전망 ────────────────────────────────────────────────────── -->
  <!-- 위에 없는 폰트가 나와도 마지막 후보로 한글 폰트를 붙여둔다.
       binding="weak" + mode="append" 라 원하는 폰트가 있으면 그쪽이 이긴다. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Apple SD Gothic Neo</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Hiragino Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>PingFang SC</string></edit>
  </match>
</fontconfig>
